# DUTORWORK — TESTE DE LOGIN NO SANKHYA (só login, nada mais).
#
# Pergunta que este job responde: o Sankhya aceita um login vindo dos
# servidores do GitHub? Ele entra, confere se a tela inicial abriu e sai.
# Não lê pedidos, não clica em nada além de "Prosseguir", não grava nada.
#
# ⚠️ O repositório é PÚBLICO: qualquer pessoa vê o log deste job. Por isso o
# script não tira print, não publica artefato e só escreve no log respostas
# sim/não e o título da página. Usuário e senha ficam nos Secrets
# (SANKHYA_USUARIO e SANKHYA_SENHA), que o GitHub mascara no log.
#
# Roda no push desta branch e pelo botão "Run workflow". Sem os Secrets, o job
# para no primeiro passo com o aviso do que falta; depois de cadastrá-los, use
# "Re-run all jobs" na execução que falhou.
name: dutorwork-teste-login

on:
  push:
    branches: [dutorwork/teste-login]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dutorwork-teste-login
  cancel-in-progress: false

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferir se os Secrets existem
        env:
          SANKHYA_USUARIO: ${{ secrets.SANKHYA_USUARIO }}
          SANKHYA_SENHA: ${{ secrets.SANKHYA_SENHA }}
        run: |
          falta=""
          [ -z "$SANKHYA_USUARIO" ] && falta="$falta SANKHYA_USUARIO"
          [ -z "$SANKHYA_SENHA" ] && falta="$falta SANKHYA_SENHA"
          if [ -n "$falta" ]; then
            echo "::error::Faltam os Secrets:$falta. Cadastre em Settings > Secrets and variables > Actions e use Re-run all jobs."
            exit 1
          fi
          echo "Secrets encontrados."

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/dutorwork

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar o navegador do robô
        working-directory: scripts/dutorwork
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Tentar o login
        working-directory: scripts/dutorwork
        env:
          SANKHYA_URL: https://lojasvaldir.sankhyacloud.com.br/mge/
          SANKHYA_USUARIO: ${{ secrets.SANKHYA_USUARIO }}
          SANKHYA_SENHA: ${{ secrets.SANKHYA_SENHA }}
        run: node teste-login.mjs
